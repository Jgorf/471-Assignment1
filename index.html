<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labs 4 & 5: Interactive Visualization with D3.js</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Labs 4 & 5: Interactive Visualization with D3.js</h1>
    <p id="value"></p>
    <div id="slider"></div>
    <div class="controls">

    <div id="vis">
